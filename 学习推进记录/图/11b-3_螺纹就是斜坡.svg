<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif"><rect x="0" y="0" width="840" height="320" fill="#ffffff"/><rect x="20" y="30" width="20" height="64" rx="3" fill="#c9cdd3" stroke="#7b8697" stroke-width="1"></rect><line x1="20" y1="42" x2="40" y2="36" stroke="#7b8697" stroke-width="1.5"></line><line x1="20" y1="51" x2="40" y2="45" stroke="#7b8697" stroke-width="1.5"></line><line x1="20" y1="60" x2="40" y2="54" stroke="#7b8697" stroke-width="1.5"></line><line x1="20" y1="69" x2="40" y2="63" stroke="#7b8697" stroke-width="1.5"></line><line x1="20" y1="78" x2="40" y2="72" stroke="#7b8697" stroke-width="1.5"></line><line x1="20" y1="87" x2="40" y2="81" stroke="#7b8697" stroke-width="1.5"></line><text x="48" y="48" font-size="11" fill="#151a23" text-anchor="start" font-weight="700">螺纹剪开一圈</text><text x="48" y="64" font-size="11" fill="#151a23" text-anchor="start" font-weight="700">摊平 = 斜坡</text><text x="48" y="82" font-size="10" fill="#5d6676" text-anchor="start" font-weight="400">（高度放大 4 倍画）</text><polygon points="50,292 290,292 290,224.09389094745796" fill="#c9cdd3" stroke="#7b8697" stroke-width="1.5"></polygon><line x1="50" y1="292" x2="290" y2="192.613486680632" stroke="#17914f" stroke-width="2" stroke-dasharray="6 5"></line><text x="170" y="308" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">底边 = 一圈的周长</text><text x="296" y="258.046945473729" font-size="11" fill="#5d6676" text-anchor="start" font-weight="400">高 = 导程</text><line x1="200" y1="40" x2="200" y2="292" stroke="#2c5fd6" stroke-width="1.5" stroke-dasharray="4 4"></line><text x="206" y="30" font-size="11" fill="#2c5fd6" text-anchor="start" font-weight="700">导轨：螺母只能上下走</text><g transform="translate(200 249.55868184216123) rotate(-15.798442699792515)"><rect x="-22" y="-26" width="44" height="26" rx="3" fill="#d4a72c" stroke="#8a6d1d" stroke-width="1.5"></rect><text x="0" y="-9" font-size="11" fill="#3a2a00" text-anchor="middle" font-weight="700">螺母</text></g><line x1="257.7335236253211" y1="219.2234362117922" x2="225.01786023763916" y2="228.48007540233465" stroke="#d23c3c" stroke-width="4"></line><polygon points="225.01786023763916,228.48007540233465 232.49797944040225,221.84322248001862 234.86640238721947,230.21392012662233" fill="#d23c3c"></polygon><text x="265.5824252003425" y="218.1344198364343" font-size="12" fill="#d23c3c" text-anchor="start" font-weight="700">被推</text><text x="300" y="188.613486680632" font-size="10" fill="#17914f" text-anchor="start" font-weight="700">绿虚线：摩擦扛得住的最陡坡</text><rect x="470" y="30" width="350" height="262" rx="10" fill="#ffffff" stroke="#d8dee7" stroke-width="1"></rect><text x="645" y="56" font-size="13" fill="#151a23" text-anchor="middle" font-weight="700">丝杆 导程 1 mm（我们的 Z 轴）</text><text x="490" y="92" font-size="12" fill="#5d6676" text-anchor="start" font-weight="400">一圈的周长</text><text x="800" y="92" font-size="14" fill="#151a23" text-anchor="end" font-weight="700">14.1 mm</text><text x="490" y="118" font-size="12" fill="#5d6676" text-anchor="start" font-weight="400">转一圈走多远</text><text x="800" y="118" font-size="14" fill="#151a23" text-anchor="end" font-weight="700">1.0 mm</text><text x="490" y="148" font-size="12" fill="#5d6676" text-anchor="start" font-weight="400">坡度</text><text x="800" y="148" font-size="22" fill="#17914f" text-anchor="end" font-weight="700">4.0°</text><text x="490" y="176" font-size="12" fill="#5d6676" text-anchor="start" font-weight="400">摩擦扛得住的坡度</text><text x="800" y="176" font-size="14" fill="#17914f" text-anchor="end" font-weight="700">5.9°</text><text x="645" y="214" font-size="16" fill="#17914f" text-anchor="middle" font-weight="700">缓坡：推不回去（自锁）✓</text><text x="645" y="240" font-size="12" fill="#5d6676" text-anchor="middle" font-weight="400">走得细：一圈只走一点点</text></svg>