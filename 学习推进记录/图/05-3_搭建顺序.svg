<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif"><rect x="0" y="0" width="840" height="340" fill="#ffffff"/><g opacity="1"><rect x="20" y="224" width="124" height="96" rx="8" fill="#e2eafc" stroke="#2c5fd6" stroke-width="2"></rect><text x="82" y="246" font-size="14" fill="#151a23" text-anchor="middle" font-weight="700">① 二维</text><text x="82" y="266" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">激光+振镜+控制卡</text><text x="82" y="281" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">，Z 固定</text><text x="82" y="308" font-size="12" fill="#17914f" text-anchor="middle" font-weight="700">✓ 打出清晰图形</text></g><g opacity="1"><rect x="154" y="190" width="124" height="130" rx="8" fill="#e2eafc" stroke="#2c5fd6" stroke-width="2"></rect><text x="216" y="212" font-size="14" fill="#151a23" text-anchor="middle" font-weight="700">② 静态对焦</text><text x="216" y="232" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">加扩束和动镜滑台（</text><text x="216" y="247" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">手动）</text><text x="216" y="308" font-size="12" fill="#17914f" text-anchor="middle" font-weight="700">✓ 两端都能对焦</text></g><g opacity="1"><rect x="288" y="156" width="124" height="164" rx="8" fill="#e2eafc" stroke="#2c5fd6" stroke-width="2"></rect><text x="350" y="178" font-size="14" fill="#151a23" text-anchor="middle" font-weight="700">③ Z 伺服</text><text x="350" y="198" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">Z 驱动板闭环接 </text><text x="350" y="213" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">Z 通道</text><text x="350" y="308" font-size="12" fill="#17914f" text-anchor="middle" font-weight="700">✓ 测出延迟 τ</text></g><g opacity="1"><rect x="422" y="122" width="124" height="198" rx="8" fill="#e2eafc" stroke="#2c5fd6" stroke-width="2"></rect><text x="484" y="144" font-size="14" fill="#151a23" text-anchor="middle" font-weight="700">④ 三轴平面</text><text x="484" y="164" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">弧面补偿 + Z </text><text x="484" y="179" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">提前量</text><text x="484" y="308" font-size="12" fill="#17914f" text-anchor="middle" font-weight="700">✓ 全幅面一致</text></g><g opacity="1"><rect x="556" y="88" width="124" height="232" rx="8" fill="#e2eafc" stroke="#2c5fd6" stroke-width="2"></rect><text x="618" y="110" font-size="14" fill="#151a23" text-anchor="middle" font-weight="700">⑤ 曲面</text><text x="618" y="130" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">加曲面高度 h</text><text x="618" y="308" font-size="12" fill="#17914f" text-anchor="middle" font-weight="700">✓ 球、柱、台阶</text></g><g opacity="1"><rect x="690" y="54" width="124" height="266" rx="8" fill="#ffffff" stroke="#5d6676" stroke-width="2" stroke-dasharray="6 4"></rect><text x="752" y="76" font-size="14" fill="#151a23" text-anchor="middle" font-weight="700">⑥ 测距</text><text x="752" y="96" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">测距替代手动输入</text><text x="752" y="308" font-size="12" fill="#5d6676" text-anchor="middle" font-weight="700">✓ 以后做</text></g></svg>