<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif"><rect x="0" y="0" width="840" height="320" fill="#ffffff"/><rect x="180" y="26" width="310" height="36" rx="8" fill="#ffffff" stroke="#d8dee7" stroke-width="1"></rect><rect x="510" y="26" width="310" height="36" rx="8" fill="#ffffff" stroke="#d8dee7" stroke-width="1"></rect><rect x="196" y="40" width="60" height="8" rx="3" fill="#c9cdd3" stroke="none" stroke-width="0"></rect><rect x="218" y="36" width="16" height="16" rx="3" fill="#d4a72c" stroke="none" stroke-width="0"></rect><text x="345" y="50" font-size="15" fill="#151a23" text-anchor="middle" font-weight="700">丝杆 + 步进</text><rect x="524" y="34" width="52" height="5" rx="3" fill="#3a4150" stroke="none" stroke-width="0"></rect><rect x="530" y="40" width="40" height="8" rx="3" fill="#c87533" stroke="none" stroke-width="0"></rect><rect x="524" y="49" width="52" height="5" rx="3" fill="#3a4150" stroke="none" stroke-width="0"></rect><text x="690" y="50" font-size="15" fill="#151a23" text-anchor="middle" font-weight="700">音圈 + 尺子 + 伺服环</text><g opacity="0.45"><text x="24" y="96" font-size="15" fill="#151a23" text-anchor="start" font-weight="700">快不快</text><text x="24" y="113" font-size="11" fill="#5d6676" text-anchor="start" font-weight="400">我们：不急</text><text x="335" y="97" font-size="14" fill="#151a23" text-anchor="middle" font-weight="400">4 mm 约 0.4 秒</text><rect x="515" y="76" width="300" height="32" rx="8" fill="#17914f22" stroke="none" stroke-width="0"></rect><text x="665" y="97" font-size="14" fill="#17914f" text-anchor="middle" font-weight="700">✓ 几毫秒</text></g><g opacity="0.45"><text x="24" y="140" font-size="15" fill="#151a23" text-anchor="start" font-weight="700">安静</text><text x="24" y="157" font-size="11" fill="#5d6676" text-anchor="start" font-weight="400">我们：无所谓</text><text x="335" y="141" font-size="14" fill="#151a23" text-anchor="middle" font-weight="400">有电机声</text><rect x="515" y="120" width="300" height="32" rx="8" fill="#17914f22" stroke="none" stroke-width="0"></rect><text x="665" y="141" font-size="14" fill="#17914f" text-anchor="middle" font-weight="700">✓ 几乎没声（拍视频要）</text></g><g opacity="1"><text x="24" y="184" font-size="15" fill="#151a23" text-anchor="start" font-weight="700">要多做什么</text><text x="24" y="201" font-size="11" fill="#5d6676" text-anchor="start" font-weight="400">我们：越少越好</text><rect x="185" y="164" width="300" height="32" rx="8" fill="#17914f22" stroke="none" stroke-width="0"></rect><text x="335" y="185" font-size="14" fill="#17914f" text-anchor="middle" font-weight="700">✓ 控制卡已有 STEP/DIR，接上就走</text><text x="665" y="185" font-size="14" fill="#151a23" text-anchor="middle" font-weight="400">+ 尺子 + 伺服环 + 调参数</text></g><g opacity="1"><text x="24" y="228" font-size="15" fill="#151a23" text-anchor="start" font-weight="700">断电以后</text><text x="24" y="245" font-size="11" fill="#5d6676" text-anchor="start" font-weight="400">运输、停机时</text><rect x="185" y="208" width="300" height="32" rx="8" fill="#17914f22" stroke="none" stroke-width="0"></rect><text x="335" y="229" font-size="14" fill="#17914f" text-anchor="middle" font-weight="700">✓ 螺纹咬住不动</text><text x="665" y="229" font-size="14" fill="#151a23" text-anchor="middle" font-weight="400">松了；开机先找零（相机也这样）</text></g><rect x="20" y="272" width="800" height="44" rx="10" fill="#e2eafc" stroke="#2c5fd6" stroke-width="1.5"></rect><text x="420" y="290" font-size="15" fill="#2c5fd6" text-anchor="middle" font-weight="700">第一台 → 丝杆：只为验证 50 m 光学，变量越少越好</text><text x="420" y="309" font-size="12" fill="#151a23" text-anchor="middle" font-weight="400">以后要边扫边对焦 → 换音圈 Z 模块（第 02 课定的：Z 模块可换）</text></svg>