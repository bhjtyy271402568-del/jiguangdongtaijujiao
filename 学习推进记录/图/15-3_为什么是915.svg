</defs><text x="80" y="26" font-size="13" fill="#151a23" text-anchor="start" font-weight="700">镱离子的能量阶梯（越高能量越大）</text><line x1="80" y1="296" x2="360" y2="296" stroke="#868e96" stroke-width="3" stroke-linecap="round"></line><text x="368" y="300" font-size="12" fill="#5d6676" text-anchor="start" font-weight="700">休息（基态）</text><line x1="80" y1="66" x2="360" y2="66" stroke="#868e96" stroke-width="3" stroke-linecap="round"></line><text x="368" y="70" font-size="12" fill="#5d6676" text-anchor="start" font-weight="700">充了电（高能态）</text><line x1="80" y1="80" x2="360" y2="80" stroke="#868e96" stroke-width="3" stroke-linecap="round"></line><line x1="80" y1="277.7913533834586" x2="360" y2="277.7913533834586" stroke="#868e96" stroke-width="3" stroke-linecap="round"></line><g filter="url(#glow)"><line x1="140" y1="296" x2="140" y2="78" stroke="#ff922b" stroke-width="7" stroke-linecap="round"></line><polygon points="140,66 131,82 149,82" fill="#ff922b"></polygon></g><text x="140" y="318" font-size="12" fill="#e8590c" text-anchor="middle" font-weight="700">泵浦光 915 nm</text><line x1="190" y1="66" x2="190" y2="80" stroke="#c92a2a" stroke-width="3" stroke-dasharray="3 3"></line><text x="200" y="78" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700">热</text><g filter="url(#glow)"><line x1="250" y1="80" x2="250" y2="265.7913533834586" stroke="#ff2d2d" stroke-width="7" stroke-linecap="round"></line><polygon points="250,277.7913533834586 241,261.7913533834586 259,261.7913533834586" fill="#ff2d2d"></polygon></g><text x="264" y="178.8956766917293" font-size="12.5" fill="#e03131" text-anchor="start" font-weight="700">激光 1064 nm</text><line x1="310" y1="277.7913533834586" x2="310" y2="296" stroke="#c92a2a" stroke-width="3" stroke-dasharray="3 3"></line><text x="320" y="291.8956766917293" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700">热</text><circle cx="310" cy="296" r="22" fill="url(#gHalo)"></circle><circle cx="310" cy="296" r="10" fill="url(#gOn)" stroke="#9a3412"></circle><circle cx="560" cy="80" r="44" fill="#e9ecef" stroke="#868e96"></circle><circle cx="560" cy="80" r="24" fill="url(#gYb)" opacity=".55" stroke="#9c8210"></circle><circle cx="566" cy="80" r="2.4" fill="#e8590c"></circle><circle cx="550.4138816979638" cy="88.78102134716497" r="2.4" fill="#e8590c"></circle><circle cx="561.7499796687889" cy="60.076707823283186" r="2.4" fill="#e8590c"></circle><circle cx="566.6918644598549" cy="88.73034650234068" r="2.4" fill="#e8590c"></circle><circle cx="542.2756185957057" cy="76.86211793798637" r="2.4" fill="#e8590c"></circle><circle cx="567.5946856285924" cy="75.17084373799608" r="2.4" fill="#e8590c"></circle><circle cx="555.84292230058" cy="95.45052442478845" r="2.4" fill="#e8590c"></circle><circle cx="556.7752498881205" cy="73.78703076492947" r="2.4" fill="#e8590c"></circle><circle cx="573.1490848537562" cy="84.80640900347854" r="2.4" fill="#e8590c"></circle><circle cx="540.5860927268035" cy="88.00626032475381" r="2.4" fill="#e8590c"></circle><circle cx="565.090148088044" cy="69.13305965592052" r="2.4" fill="#e8590c"></circle><circle cx="565.679060220925" cy="98.13141679536125" r="2.4" fill="#e8590c"></circle><circle cx="551.3501011717981" cy="74.98210698979429" r="2.4" fill="#e8590c"></circle><circle cx="576.6052311141484" cy="76.35770681496992" r="2.4" fill="#e8590c"></circle><text x="616" y="74" font-size="12" fill="#151a23" text-anchor="start" font-weight="700">光纤截面：纤芯里掺着</text><text x="616" y="92" font-size="12" fill="#e8590c" text-anchor="start" font-weight="700">镱离子（橙点）</text><rect x="500" y="140" width="300" height="24" rx="5" fill="#ffa94d" opacity=".55"></rect><text x="650" y="157" font-size="12" fill="#151a23" text-anchor="middle" font-weight="700">泵浦光 100%</text><rect x="500" y="172" width="257.9887218045113" height="24" rx="5" fill="#ff4d4f"></rect><text x="628.9943609022556" y="189" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">激光 ≈ 86%</text><rect x="759.9887218045112" y="172" width="40.01127819548872" height="24" rx="5" fill="#c92a2a"></rect><text x="778.9943609022556" y="189" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">热</text><text x="500" y="214" font-size="11.5" fill="#5d6676" text-anchor="start" font-weight="400">这约 14% 变成热（量子亏损），光纤要散热</text><text x="500" y="248" font-size="12.5" fill="#151a23" text-anchor="start" font-weight="700">泵浦波长 915 nm：镱离子吸收得好不好</text><rect x="500" y="258" width="300" height="18" rx="9" fill="#f4f6f9" stroke="#d8dee7"></rect><rect x="500" y="258" width="111" height="18" rx="9" fill="#17914f"></rect><text x="500" y="298" font-size="12" fill="#17914f" text-anchor="start" font-weight="700">吸收不错：915 nm 附近，峰宽、好用</text><text x="500" y="318" font-size="11" fill="#5d6676" text-anchor="start" font-weight="400">（吸收峰位置为常识值，具体看光纤规格书）</text></svg>