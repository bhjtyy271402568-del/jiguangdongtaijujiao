<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif"><rect x="0" y="0" width="840" height="340" fill="#ffffff"/><line x1="90" y1="300" x2="340" y2="300" stroke="#5d6676" stroke-width="2"></line><text x="346" y="304" font-size="12" fill="#5d6676" text-anchor="start" font-weight="700">基态（休息）</text><line x1="90" y1="60" x2="340" y2="60" stroke="#5d6676" stroke-width="2"></line><text x="346" y="64" font-size="12" fill="#5d6676" text-anchor="start" font-weight="700">高能态（充了电）</text><line x1="90" y1="74" x2="340" y2="74" stroke="#5d6676" stroke-width="2"></line><text x="346" y="78" font-size="12" fill="#5d6676" text-anchor="start" font-weight="700"></text><line x1="90" y1="280.390977443609" x2="340" y2="280.390977443609" stroke="#5d6676" stroke-width="2"></line><text x="346" y="284.390977443609" font-size="12" fill="#5d6676" text-anchor="start" font-weight="700"></text><text x="346" y="284.390977443609" font-size="1" fill="#151a23" text-anchor="middle" font-weight="400"></text><text x="90" y="24" font-size="13" fill="#151a23" text-anchor="start" font-weight="700">镱离子的能量阶梯（越高能量越大）</text><path d="M150,300 V68" stroke="#ff8a3d" stroke-width="5" fill="none"></path><polygon points="150,60 140,74 160,74" fill="#ff8a3d"></polygon><text x="150" y="322" font-size="12" fill="#ff8a3d" text-anchor="middle" font-weight="700">泵浦光 915 nm</text><path d="M190,60 V74" stroke="#b91c1c" stroke-width="4" fill="none" stroke-dasharray="3 3"></path><text x="200" y="71" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700">热</text><circle cx="190" cy="74" r="9" fill="#ff8a3d" stroke="#b5500f" stroke-width="2"></circle><path d="M240,74 V272.390977443609" stroke="#e5383b" stroke-width="5" fill="none"></path><polygon points="240,280.390977443609 230,266.390977443609 250,266.390977443609" fill="#e5383b"></polygon><text x="254" y="177.1954887218045" font-size="12" fill="#e5383b" text-anchor="start" font-weight="700">激光 1064 nm</text><path d="M290,280.390977443609 V300" stroke="#b91c1c" stroke-width="4" fill="none" stroke-dasharray="3 3"></path><text x="300" y="294.1954887218045" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700">热</text><rect x="500" y="40" width="320" height="140" rx="10" fill="#ffffff" stroke="#d8dee7"></rect><text x="660" y="64" font-size="13" fill="#151a23" text-anchor="middle" font-weight="700">一个泵浦光子的能量去哪了</text><rect x="520" y="84" width="280" height="26" rx="4" fill="#ff8a3d" opacity=".35"></rect><text x="660" y="102" font-size="12" fill="#151a23" text-anchor="middle" font-weight="700">泵浦光 100%</text><rect x="520" y="122" width="240.78947368421052" height="26" rx="4" fill="#e5383b" opacity=".7"></rect><text x="640.3947368421052" y="140" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">激光 ≈ 86%</text><rect x="760.7894736842105" y="122" width="39.21052631578947" height="26" rx="4" fill="#b91c1c" opacity=".7"></rect><text x="780.3947368421052" y="140" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">热</text><text x="660" y="168" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">这 14% 就是“量子亏损”，变成热，光纤要散热</text><rect x="500" y="196" width="320" height="120" rx="10" fill="#ffffff" stroke="#d8dee7"></rect><text x="660" y="220" font-size="13" fill="#151a23" text-anchor="middle" font-weight="700">泵浦波长 915 nm：镱离子吸收得好不好</text><rect x="520" y="238" width="280" height="22" rx="11" fill="#f4f6f9"></rect><rect x="520" y="238" width="103.6" height="22" rx="11" fill="#17914f"></rect><text x="660" y="284" font-size="12" fill="#17914f" text-anchor="middle" font-weight="700">吸收不错：915 nm 附近，峰宽、好用</text><text x="660" y="304" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">（吸收峰位置为常识值，具体看光纤规格书）</text></svg>