" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="402" cy="120" r="9" fill="url(#gHalo)" opacity="0.3829862459202376"></circle><circle cx="402" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="422" cy="120" r="9" fill="url(#gHalo)" opacity="0.36053102875691595"></circle><circle cx="422" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="442" cy="120" r="9" fill="url(#gHalo)" opacity="0.3393924039862019"></circle><circle cx="442" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="462" cy="120" r="9" fill="url(#gHalo)" opacity="0.3194931772743394"></circle><circle cx="462" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="482" cy="120" r="9" fill="url(#gHalo)" opacity="0.30076068033921693"></circle><circle cx="482" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="502" cy="120" r="9" fill="url(#gHalo)" opacity="0.2831265055792909"></circle><circle cx="502" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="522" cy="120" r="9" fill="url(#gHalo)" opacity="0.2665262562617229"></circle><circle cx="522" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="542" cy="120" r="9" fill="url(#gHalo)" opacity="0.25089931135746496"></circle><circle cx="542" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="562" cy="120" r="9" fill="url(#gHalo)" opacity="0.23618860416451512"></circle><circle cx="562" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="582" cy="120" r="9" fill="url(#gHalo)" opacity="0.22234041391091372"></circle><circle cx="582" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="602" cy="120" r="9" fill="url(#gHalo)" opacity="0.20930416957645748"></circle><circle cx="602" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="622" cy="120" r="9" fill="url(#gHalo)" opacity="0.19703226521672"></circle><circle cx="622" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="642" cy="120" r="9" fill="url(#gHalo)" opacity="0.18547988611498048"></circle><circle cx="642" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="662" cy="120" r="9" fill="url(#gHalo)" opacity="0.1746048451271966"></circle><circle cx="662" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="682" cy="120" r="9" fill="url(#gHalo)" opacity="0.16436742862238587"></circle><circle cx="682" cy="120" r="4" fill="url(#gOn)"></circle><circle cx="702" cy="120" r="9" fill="url(#gHalo)" opacity="0.154730251455817"></circle><circle cx="702" cy="120" r="4" fill="url(#gOn)"></circle><rect x="726" y="94" width="16.083753615839743" height="52" fill="#f76707" opacity="0.1072250241055983" filter="url(#blur6)"></rect><text x="150" y="80" font-size="12" fill="#151a23" text-anchor="start" font-weight="700">一段掺镱光纤（放大画，纤芯里的小球 = 镱离子，亮 = 吃到了光、充上了电）</text><text x="720" y="170" font-size="12" fill="#151a23" text-anchor="end" font-weight="700">从另一头穿出去（没被吃掉）：18%</text><rect x="34" y="186" width="380" height="132" rx="12" fill="#ffffff" stroke="#d8dee7"></rect><text x="52" y="210" font-size="13" fill="#151a23" text-anchor="start" font-weight="700">条件一：镱离子吃不吃得下？</text><rect x="52" y="222" width="340" height="16" rx="8" fill="#f4f6f9" stroke="#d8dee7"></rect><rect x="52" y="222" width="139.4" height="16" rx="8" fill="#17914f"></rect><text x="52" y="262" font-size="12" fill="#17914f" text-anchor="start" font-weight="700">吃得下（915 附近，范围宽、好用）</text><text x="52" y="284" font-size="11.5" fill="#5d6676" text-anchor="start" font-weight="400">镱离子只认 915、976 nm 附近的光（离子本身的性质）</text><text x="52" y="304" font-size="11.5" fill="#5d6676" text-anchor="start" font-weight="400">↔ 拖滑块找找看</text><rect x="426" y="186" width="400" height="132" rx="12" fill="#ffffff" stroke="#d8dee7"></rect><text x="442" y="210" font-size="13" fill="#151a23" text-anchor="start" font-weight="700">条件二：每个光子的能量够不够？</text><text x="442" y="238" font-size="11.5" fill="#151a23" text-anchor="start" font-weight="700">泵浦光子</text><rect x="506" y="227" width="167.44918032786887" height="16" rx="4" fill="#f76707"></rect><text x="442" y="264" font-size="11.5" fill="#151a23" text-anchor="start" font-weight="700">激光光子</text><rect x="506" y="253" width="144" height="16" rx="4" fill="#ff4d4f"></rect><text x="656" y="266" font-size="11" fill="#151a23" text-anchor="start" font-weight="400">1064 nm</text><rect x="650" y="227" width="23.449180327868874" height="16" rx="4" fill="#c92a2a" opacity=".85"></rect><text x="679.4491803278688" y="240" font-size="11" fill="#c92a2a" text-anchor="start" font-weight="700">多出 14% → 变成热</text><text x="442" y="292" font-size="12" fill="#17914f" text-anchor="start" font-weight="700">波长越短，每个光子能量越大；泵浦必须比 1064 nm 短</text><text x="442" y="310" font-size="11.5" fill="#5d6676" text-anchor="start" font-weight="400">（能量 ∝ 1 / 波长，就像蓝光比红光“猛”）</text><text x="420" y="24" font-size="14" fill="#17914f" text-anchor="middle" font-weight="700">915 nm：两个条件都满足 → 能当泵浦</text></svg>