<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif"><rect x="0" y="0" width="840" height="300" fill="#ffffff"/><text x="420" y="26" font-size="14" fill="#151a23" text-anchor="middle" font-weight="700">反过来用：激光从小镜进、大镜出 = 扩束 + 调焦</text><rect x="140" y="82" width="390" height="136" rx="10" fill="none" stroke="#d8dee7" stroke-width="2"></rect><ellipse cx="152" cy="150" rx="6" ry="16" fill="#dcecf8" stroke="#e0701c" stroke-width="3"></ellipse><text x="152" y="190" font-size="13" fill="#e0701c" text-anchor="middle" font-weight="700">动镜（小）</text><ellipse cx="530" cy="150" rx="10" ry="62" fill="#dcecf8" stroke="#2b7bb9" stroke-width="3"></ellipse><text x="530" y="238" font-size="13" fill="#2b7bb9" text-anchor="middle" font-weight="700">物镜 f2 = 300 mm</text><rect x="20" y="138" width="120" height="24" fill="#e5383b" opacity=".35"></rect><text x="60" y="128" font-size="12" fill="#e5383b" text-anchor="middle" font-weight="700">激光</text><polygon points="140,142 140,158 530,92 530,208" fill="#e5383b" opacity=".25"></polygon><polygon points="530,92 530,208 830,150" fill="#e5383b" opacity=".2"></polygon><text x="800" y="135" font-size="13" fill="#5d6676" text-anchor="end" font-weight="400">→ 50 m</text><path d="M126,222 L154,222" stroke="#e0701c" stroke-width="3" marker-end=""></path><text x="140" y="244" font-size="12" fill="#e0701c" text-anchor="middle" font-weight="400">⟷ 调焦：镜片走一点点</text><text x="420" y="284" font-size="15" fill="#17914f" text-anchor="middle" font-weight="700">对焦 10 m → 50 m，动镜要走约 7.2 mm</text></svg>