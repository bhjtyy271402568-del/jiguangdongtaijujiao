d" stroke-width="2.9122365389677705" opacity=".85" stroke-linecap="round"></line><line x1="312" y1="110" x2="400" y2="110" stroke="#fff3f3" stroke-width="1" stroke-linecap="round"></line></g><rect x="40" y="186" width="360" height="112" rx="10" fill="#ffffff" stroke="#d8dee7"></rect><text x="56" y="210" font-size="12" fill="#151a23" text-anchor="start" font-weight="700">绕一圈：放大 × 反射回来的比例 = 环路增益</text><text x="56" y="240" font-size="15" fill="#17914f" text-anchor="start" font-weight="700">起振时：1.58 × 0.8 = 1.26</text><text x="56" y="264" font-size="12" fill="#17914f" text-anchor="start" font-weight="700">大于 1：光每圈变强 → 起振</text><text x="56" y="286" font-size="11.5" fill="#1971c2" text-anchor="start" font-weight="700">稳定后：增益被压到刚好 1（光把原子抽空了）</text><rect x="430" y="30" width="400" height="220" rx="12" fill="#2b2f36"></rect><rect x="440" y="40" width="380" height="200" rx="6" fill="#07140d"></rect><line x1="487.5" y1="40" x2="487.5" y2="240" stroke="#16351f"></line><line x1="535" y1="40" x2="535" y2="240" stroke="#16351f"></line><line x1="582.5" y1="40" x2="582.5" y2="240" stroke="#16351f"></line><line x1="630" y1="40" x2="630" y2="240" stroke="#16351f"></line><line x1="677.5" y1="40" x2="677.5" y2="240" stroke="#16351f"></line><line x1="725" y1="40" x2="725" y2="240" stroke="#16351f"></line><line x1="772.5" y1="40" x2="772.5" y2="240" stroke="#16351f"></line><line x1="440" y1="80" x2="820" y2="80" stroke="#16351f"></line><line x1="440" y1="120" x2="820" y2="120" stroke="#16351f"></line><line x1="440" y1="160" x2="820" y2="160" stroke="#16351f"></line><line x1="440" y1="200" x2="820" y2="200" stroke="#16351f"></line><path d="" fill="none" stroke="#8ce99a" stroke-width="2.2" filter="url(#glow)"></path><text x="448" y="58" font-size="11" fill="#8ce99a" text-anchor="start" font-weight="700">腔里的光强 ↑</text><text x="814" y="232" font-size="11" fill="#8ce99a" text-anchor="end" font-weight="700">时间 →</text><line x1="440" y1="196.55203444521447" x2="820" y2="196.55203444521447" stroke="#ffd43b" stroke-dasharray="5 4"></line><text x="814" y="190.55203444521447" font-size="11" fill="#ffd43b" text-anchor="end" font-weight="700">稳定</text><text x="630" y="276" font-size="12.5" fill="#17914f" text-anchor="middle" font-weight="700">输出功率（相对）：1.6</text><text x="420" y="22" font-size="14" fill="#17914f" text-anchor="middle" font-weight="700">光强了就把原子抽空，增益降到刚好 1 → 稳定输出</text></svg>