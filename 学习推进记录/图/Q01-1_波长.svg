="700">光纤激光 1064</text><text x="470" y="256" font-size="13" fill="#d23c3c" text-anchor="middle" font-weight="700">近红外：看不见！</text><text x="470" y="276" font-size="11.5" fill="#d23c3c" text-anchor="middle" font-weight="400">设备开着也看不到光束 → 必须戴对应波长的防护眼镜</text><rect x="724" y="114" width="72" height="18" rx="9" fill="url(#gGlass)" stroke="#7fb3d5"></rect><rect x="730" y="119" width="60" height="8" rx="4" fill="url(#gPlasma)" opacity=".8"></rect><line x1="760" y1="132" x2="760" y2="170" stroke="#adb5bd" stroke-dasharray="3 3"></line><text x="760" y="106" font-size="11" fill="#151a23" text-anchor="middle" font-weight="700">CO₂ 激光 10.6 μm</text><text x="760" y="256" font-size="12.5" fill="#d23c3c" text-anchor="middle" font-weight="700">远红外</text><text x="760" y="274" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">比 1064 长 10 倍</text><text x="420" y="26" font-size="14" fill="#151a23" text-anchor="middle" font-weight="700">CO₂ 激光在更远的地方：10.6 μm</text></svg>