<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif"><rect x="0" y="0" width="840" height="300" fill="#ffffff"/><rect x="20" y="90" width="104" height="60" rx="10" fill="#17914f22" stroke="#17914f" stroke-width="2"></rect><text x="72" y="116" font-size="14" fill="#151a23" text-anchor="middle" font-weight="700">上位机</text><text x="72" y="136" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">点 (300, 0)</text><line x1="124" y1="120" x2="138" y2="120" stroke="#5d6676" stroke-width="2"></line><rect x="138" y="90" width="104" height="60" rx="10" fill="#17914f22" stroke="#17914f" stroke-width="2"></rect><text x="190" y="116" font-size="14" fill="#151a23" text-anchor="middle" font-weight="700">MCU ①</text><text x="190" y="136" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">算振镜角度</text><line x1="242" y1="120" x2="256" y2="120" stroke="#5d6676" stroke-width="2"></line><rect x="256" y="90" width="104" height="60" rx="10" fill="#e2eafc" stroke="#2c5fd6" stroke-width="3"></rect><text x="308" y="116" font-size="14" fill="#151a23" text-anchor="middle" font-weight="700">MCU ②</text><text x="308" y="136" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">算焦点距离</text><line x1="360" y1="120" x2="374" y2="120" stroke="#5d6676" stroke-width="2"></line><rect x="374" y="90" width="104" height="60" rx="10" fill="#ffffff" stroke="#d8dee7" stroke-width="2"></rect><text x="426" y="116" font-size="14" fill="#151a23" text-anchor="middle" font-weight="700">MCU ③</text><text x="426" y="136" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">查标定表</text><line x1="478" y1="120" x2="492" y2="120" stroke="#5d6676" stroke-width="2"></line><rect x="492" y="90" width="104" height="60" rx="10" fill="#ffffff" stroke="#d8dee7" stroke-width="2"></rect><text x="544" y="116" font-size="14" fill="#151a23" text-anchor="middle" font-weight="700">FPGA</text><text x="544" y="136" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">同步发 X/Y/Z</text><line x1="596" y1="120" x2="610" y2="120" stroke="#5d6676" stroke-width="2"></line><rect x="610" y="90" width="104" height="60" rx="10" fill="#ffffff" stroke="#d8dee7" stroke-width="2"></rect><text x="662" y="116" font-size="14" fill="#151a23" text-anchor="middle" font-weight="700">驱动</text><text x="662" y="136" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">振镜 + Z</text><line x1="714" y1="120" x2="728" y2="120" stroke="#5d6676" stroke-width="2"></line><rect x="728" y="90" width="104" height="60" rx="10" fill="#ffffff" stroke="#d8dee7" stroke-width="2"></rect><text x="780" y="116" font-size="14" fill="#151a23" text-anchor="middle" font-weight="700">目标</text><text x="780" y="136" font-size="11" fill="#5d6676" text-anchor="middle" font-weight="400">光点清晰</text><rect x="132" y="60" width="352" height="104" rx="12" fill="none" stroke="#2c5fd6" stroke-dasharray="6 4"></rect><text x="308" y="52" font-size="12" fill="#2c5fd6" text-anchor="middle" font-weight="700">全在 MCU 里算</text><circle cx="308" cy="168" r="9" fill="#facc15" stroke="#b45309" stroke-width="2"></circle><rect x="20" y="210" width="800" height="56" rx="10" fill="#ffffff" stroke="#d8dee7"></rect><text x="420" y="244" font-size="15" fill="#151a23" text-anchor="middle" font-weight="700">√(1000² + 300²) ≈ 1044 mm，比中心远 44 mm（弧面补偿）</text></svg>