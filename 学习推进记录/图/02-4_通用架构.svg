<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif"><rect x="0" y="0" width="820" height="300" fill="#ffffff"/>
    <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5d6676"></path></marker></defs>
    <rect x="16" y="96" width="110" height="60" rx="10" fill="#ffffff" stroke="#d8dee7" stroke-width="2"></rect>
    <text x="71" y="131" text-anchor="middle" font-size="15" fill="#151a23">上位机</text>
    <line x1="126" y1="126" x2="166" y2="126" stroke="#5d6676" stroke-width="2" marker-end="url(#ar)"></line>
    <rect x="168" y="80" width="190" height="92" rx="12" fill="#e2eafc" stroke="#2c5fd6" stroke-width="2.5"></rect>
    <text x="263" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#2c5fd6">控制卡（项目①）</text>
    <text x="263" y="136" text-anchor="middle" font-size="13" fill="#2c5fd6">X / Y / Z 同一时间轴</text>
    <text x="263" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#17914f">✓ 换模块也不用改</text>
    <line x1="358" y1="126" x2="440" y2="126" stroke="#5d6676" stroke-width="2" marker-end="url(#ar)"></line>
    <text x="399" y="112" text-anchor="middle" font-size="13" fill="#151a23">焦点位置</text>
    <text id="aZ" x="399" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#151a23" font-family="JetBrains Mono,monospace">12.0 mm</text>
    <rect id="aAdBox" x="442" y="80" width="150" height="92" rx="12" fill="#ffffff" stroke="#e0701c" stroke-width="2.5" stroke-dasharray="6 4"></rect>
    <text x="517" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#e0701c">标定表</text>
    <text id="aMap1" x="517" y="134" text-anchor="middle" font-size="13" fill="#151a23">焦点 → 电机位置</text>
    <text id="aMap2" x="517" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#151a23" font-family="JetBrains Mono,monospace">0.70 mm</text>
    <line x1="592" y1="126" x2="630" y2="126" stroke="#5d6676" stroke-width="2" marker-end="url(#ar)"></line>
    <rect id="aModBox" x="632" y="70" width="172" height="112" rx="12" fill="#ffffff" stroke="#e0701c" stroke-width="2.5" stroke-dasharray="6 4"></rect>
    <g id="aIcon"><ellipse cx="690" cy="112" rx="5" ry="18" fill="#dcecf8" stroke="#2b7bb9" stroke-width="2"></ellipse><ellipse cx="748" cy="112" rx="7" ry="28" fill="#dcecf8" stroke="#2b7bb9" stroke-width="2"></ellipse><text x="690" y="148" font-size="16" text-anchor="middle" fill="#e0701c">⟷</text></g>
    <text id="aModT" x="718" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#e0701c">移动透镜模块</text>
    <path d="M442,200 L804,200" stroke="#e0701c" stroke-width="2"></path>
    <text x="623" y="222" text-anchor="middle" font-size="13" fill="#e0701c">↑ 换模块时只换这两块（项目②）</text>
    <rect x="168" y="230" width="190" height="50" rx="10" fill="#ffffff" stroke="#d8dee7" stroke-width="2" stroke-dasharray="5 4"></rect>
    <text x="263" y="252" text-anchor="middle" font-size="13" fill="#5d6676">测高传感器（以后加）</text>
    <text x="263" y="270" text-anchor="middle" font-size="12" fill="#5d6676">告诉卡“表面在哪”</text>
    <line x1="263" y1="230" x2="263" y2="176" stroke="#5d6676" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ar)"></line>
  </svg>