<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif"><rect x="0" y="0" width="840" height="320" fill="#ffffff"/><g opacity="0.42"><rect x="20" y="40" width="260" height="240" rx="12" fill="#ffffff" stroke="#d8dee7" stroke-width="1"></rect><text x="150" y="66" font-size="15" fill="#151a23" text-anchor="middle" font-weight="700">① 买整套 Z 模块</text><rect x="60" y="110" width="160" height="64" rx="10" fill="#3a4150" stroke="none" stroke-width="0"></rect><ellipse cx="100" cy="142" rx="6" ry="16" fill="#dcecf8" stroke="#2b7bb9" stroke-width="2"></ellipse><ellipse cx="170" cy="142" rx="6" ry="24" fill="#dcecf8" stroke="#2b7bb9" stroke-width="2"></ellipse><rect x="220" y="134" width="40" height="16" rx="3" fill="#9aa3ad" stroke="none" stroke-width="0"></rect><text x="140" y="100" font-size="12" fill="#5d6676" text-anchor="middle" font-weight="400">商业产品（如 R036）</text><path d="M60,142 H30" stroke="#e5383b" stroke-width="2"></path><text x="150" y="206" font-size="13" fill="#151a23" text-anchor="middle" font-weight="400">很快：不到 1 毫秒</text><text x="150" y="226" font-size="13" fill="#151a23" text-anchor="middle" font-weight="400">但按 0.2–0.7 m 设计</text><text x="150" y="246" font-size="13" fill="#151a23" text-anchor="middle" font-weight="400">配 14 mm 振镜</text><text x="150" y="270" font-size="14" fill="#d23c3c" text-anchor="middle" font-weight="700">✗ 打 50 m 对不上</text></g><g opacity="1"><rect x="290" y="40" width="260" height="240" rx="12" fill="#ffffff" stroke="#2c5fd6" stroke-width="3"></rect><text x="420" y="66" font-size="15" fill="#151a23" text-anchor="middle" font-weight="700">② 买电动平移台，装镜片</text><rect x="310" y="178" width="220" height="10" rx="3" fill="#7b8697" stroke="none" stroke-width="0"></rect><rect x="326" y="146" width="120" height="32" rx="3" fill="#55606e" stroke="none" stroke-width="0"></rect><rect x="446" y="152" width="30" height="22" rx="3" fill="#1d2330" stroke="#5d6676" stroke-width="1"></rect><rect x="343.9504365378993" y="136" width="80" height="10" rx="3" fill="#9aa3ad" stroke="none" stroke-width="0"></rect><rect x="379.9504365378993" y="104" width="6" height="32" rx="3" fill="#6b7686" stroke="none" stroke-width="0"></rect><ellipse cx="382.9504365378993" cy="96" rx="6" ry="14" fill="#dcecf8" stroke="#2b7bb9" stroke-width="2"></ellipse><rect x="502" y="118" width="8" height="60" rx="3" fill="#6b7686" stroke="none" stroke-width="0"></rect><ellipse cx="506" cy="110" rx="6" ry="22" fill="#dcecf8" stroke="#2b7bb9" stroke-width="2"></ellipse><text x="380" y="170" font-size="11" fill="#e7ebf1" text-anchor="middle" font-weight="700">平移台</text><text x="494" y="104" font-size="11" fill="#5d6676" text-anchor="end" font-weight="400">物镜</text><text x="393.9504365378993" y="100" font-size="11" fill="#5d6676" text-anchor="start" font-weight="400">动镜</text><text x="420" y="206" font-size="13" fill="#151a23" text-anchor="middle" font-weight="400">电机、丝杆、导轨、原点开关</text><text x="420" y="226" font-size="13" fill="#151a23" text-anchor="middle" font-weight="400">厂家已经装好、调好</text><text x="420" y="246" font-size="13" fill="#151a23" text-anchor="middle" font-weight="400">我们只做镜座和底板</text><text x="420" y="270" font-size="14" fill="#17914f" text-anchor="middle" font-weight="700">✓ 第一台样机就用它</text></g><g opacity="0.42"><rect x="560" y="40" width="260" height="240" rx="12" fill="#ffffff" stroke="#d8dee7" stroke-width="1"></rect><text x="690" y="66" font-size="15" fill="#151a23" text-anchor="middle" font-weight="700">③ 自己设计，全部集成</text><rect x="590" y="96" width="200" height="84" rx="10" fill="none" stroke="#5d6676" stroke-width="2"></rect><rect x="590" y="92" width="200" height="6" rx="3" fill="#5d6676" stroke="none" stroke-width="0"></rect><rect x="608" y="128" width="24" height="14" rx="3" fill="#1d2330" stroke="#5d6676" stroke-width="1"></rect><rect x="632" y="132" width="70" height="6" rx="3" fill="#c9cdd3" stroke="none" stroke-width="0"></rect><rect x="652" y="120" width="16" height="24" rx="3" fill="#d4a72c" stroke="none" stroke-width="0"></rect><ellipse cx="660" cy="112" rx="6" ry="10" fill="#dcecf8" stroke="#2b7bb9" stroke-width="2"></ellipse><ellipse cx="720" cy="135" rx="6" ry="22" fill="#dcecf8" stroke="#2b7bb9" stroke-width="2"></ellipse><line x1="750" y1="120" x2="772" y2="150" stroke="#2b7bb9" stroke-width="4"></line><rect x="786" y="124" width="6" height="30" rx="2" fill="#dcecf8" stroke="#2b7bb9" stroke-width="1.5"></rect><text x="690" y="206" font-size="13" fill="#151a23" text-anchor="middle" font-weight="400">就是 v0.3 那套 3D 结构</text><text x="690" y="226" font-size="13" fill="#151a23" text-anchor="middle" font-weight="400">密封、紧凑，做多了便宜</text><text x="690" y="246" font-size="13" fill="#151a23" text-anchor="middle" font-weight="400">每个零件都要自己装调</text><text x="690" y="270" font-size="14" fill="#e0701c" text-anchor="middle" font-weight="700">→ 样机通过后再做</text></g><line x1="420" y1="300" x2="680" y2="300" stroke="#2c5fd6" stroke-width="2.5"></line><polygon points="680,300 670.9955289764732,304.3496553411123 670.9955289764732,295.6503446588877" fill="#2c5fd6"></polygon><text x="400" y="305" font-size="13" fill="#2c5fd6" text-anchor="end" font-weight="700">先 ②</text><text x="700" y="305" font-size="13" fill="#2c5fd6" text-anchor="start" font-weight="700">后 ③</text><text x="550" y="316" font-size="11" fill="#2c5fd6" text-anchor="middle" font-weight="700">50 m 光点验证通过</text></svg>