<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif"><rect x="0" y="0" width="840" height="320" fill="#ffffff"/><rect x="300" y="122" width="240" height="96" rx="8" fill="#ff8a3d" opacity=".25" stroke="#b5500f" stroke-width="1.5"></rect><text x="420" y="240" font-size="13" fill="#151a23" text-anchor="middle" font-weight="700">发光材料（充了电的原子）</text><path d="M330,100 V118" stroke="#ff8a3d" stroke-width="2.5"></path><polygon points="330,122 325,112 335,112" fill="#ff8a3d"></polygon><path d="M375,100 V118" stroke="#ff8a3d" stroke-width="2.5"></path><polygon points="375,122 370,112 380,112" fill="#ff8a3d"></polygon><path d="M420,100 V118" stroke="#ff8a3d" stroke-width="2.5"></path><polygon points="420,122 415,112 425,112" fill="#ff8a3d"></polygon><path d="M465,100 V118" stroke="#ff8a3d" stroke-width="2.5"></path><polygon points="465,122 460,112 470,112" fill="#ff8a3d"></polygon><path d="M510,100 V118" stroke="#ff8a3d" stroke-width="2.5"></path><polygon points="510,122 505,112 515,112" fill="#ff8a3d"></polygon><text x="420" y="88" font-size="13" fill="#ff8a3d" text-anchor="middle" font-weight="700">泵浦（一直在充电）</text><rect x="144" y="100" width="12" height="140" rx="3" fill="#7b8697"></rect><text x="150" y="88" font-size="12" fill="#151a23" text-anchor="middle" font-weight="700">镜子（全反射）</text><rect x="684" y="100" width="12" height="140" rx="3" fill="#7b8697" opacity="0.7749999999999999"></rect><text x="690" y="88" font-size="12" fill="#151a23" text-anchor="middle" font-weight="700">镜子（反射 70%）</text><circle cx="150" cy="170" r="7.2" fill="#e8b04a" stroke="#8a6d00" stroke-width="1.4" opacity=".92"></circle><line x1="150" y1="170" x2="690" y2="170" stroke="#e8b04a" stroke-width="1" stroke-dasharray="2 6" opacity=".5"></line><rect x="696" y="166.12" width="120" height="7.759999999999998" fill="#e5383b" opacity=".75"></rect><text x="770" y="158.12" font-size="14" fill="#e5383b" text-anchor="middle" font-weight="700">激光</text><text x="420" y="34" font-size="14" fill="#17914f" text-anchor="middle" font-weight="700">右边镜子漏出一点 = 激光</text><text x="420" y="262" font-size="12" fill="#151a23" text-anchor="middle" font-weight="700">腔里的光（攒了多少）</text><rect x="300" y="270" width="240" height="12" rx="6" fill="#f4f6f9"></rect><rect x="300" y="270" width="4" height="12" rx="6" fill="#e8b04a"></rect><text x="420" y="306" font-size="13" fill="#17914f" text-anchor="middle" font-weight="700">每秒漏出来的激光：5.2（相对值）</text></svg>