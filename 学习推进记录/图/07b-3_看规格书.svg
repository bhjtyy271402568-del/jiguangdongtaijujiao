<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif"><rect x="0" y="0" width="840" height="330" fill="#ffffff"/><rect x="40" y="20" width="520" height="280" rx="10" fill="#ffffff" stroke="#d8dee7" stroke-width="2"></rect><text x="60" y="46" font-size="14" fill="#5d6676" text-anchor="start" font-weight="700">某光纤激光器规格书（示意）</text><text x="64" y="88" font-size="14" fill="#5d6676" text-anchor="start" font-weight="400">中心波长</text><text x="220" y="88" font-size="15" fill="#151a23" text-anchor="start" font-weight="400">1064 nm</text><text x="64" y="134" font-size="14" fill="#5d6676" text-anchor="start" font-weight="400">输出功率</text><text x="220" y="134" font-size="15" fill="#151a23" text-anchor="start" font-weight="400">（按应用定）</text><rect x="48" y="154" width="504" height="40" rx="6" fill="#e2eafc" stroke="#2c5fd6" stroke-width="2"></rect><text x="64" y="180" font-size="14" fill="#5d6676" text-anchor="start" font-weight="400">光束质量</text><text x="220" y="180" font-size="15" fill="#2c5fd6" text-anchor="start" font-weight="700">M² &lt; 1.1　或　BPP 0.37 mm·mrad</text><text x="64" y="226" font-size="14" fill="#5d6676" text-anchor="start" font-weight="400">输出光束直径</text><text x="220" y="226" font-size="15" fill="#151a23" text-anchor="start" font-weight="400">（准直器决定，如 4–7 mm）</text><text x="64" y="272" font-size="14" fill="#5d6676" text-anchor="start" font-weight="400">工作模式</text><text x="220" y="272" font-size="15" fill="#151a23" text-anchor="start" font-weight="400">连续 / 脉冲</text><g opacity="1"><rect x="590" y="70" width="230" height="170" rx="10" fill="#e2eafc" stroke="#2c5fd6" stroke-width="2"></rect><text x="705" y="100" font-size="14" fill="#2c5fd6" text-anchor="middle" font-weight="700">BPP 换算成 M²</text><text x="705" y="134" font-size="17" fill="#151a23" text-anchor="middle" font-weight="700">M² = BPP ÷ 0.34</text><text x="705" y="160" font-size="12" fill="#5d6676" text-anchor="middle" font-weight="400">（1064 nm 时）</text><text x="705" y="196" font-size="13" fill="#17914f" text-anchor="middle" font-weight="700">例：0.37 ÷ 0.34 ≈ 1.09 ✓</text><text x="705" y="220" font-size="13" fill="#d23c3c" text-anchor="middle" font-weight="700">例：2.5 ÷ 0.34 ≈ 7.4 ✗</text></g></svg>