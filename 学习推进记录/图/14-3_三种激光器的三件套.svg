<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif"><rect x="0" y="0" width="840" height="340" fill="#ffffff"/><text x="110" y="36" font-size="14" fill="#ff8a3d" text-anchor="middle" font-weight="700">① 泵浦</text><text x="420" y="36" font-size="14" fill="#b5500f" text-anchor="middle" font-weight="700">② 发光材料</text><text x="730" y="36" font-size="14" fill="#5d6676" text-anchor="middle" font-weight="700">③ 两面镜子</text><rect x="60" y="110" width="100" height="40" rx="6" fill="#ffb36b" stroke="#b5500f" stroke-width="1.6"></rect><text x="110" y="135" font-size="12" fill="#7a3300" text-anchor="middle" font-weight="700">半导体激光</text><path d="M160,130 H260" stroke="#ff8a3d" stroke-width="3"></path><polygon points="264,130 252,124 252,136" fill="#ff8a3d"></polygon><text x="210" y="118" font-size="12" fill="#ff8a3d" text-anchor="middle" font-weight="700">激光照射</text><ellipse cx="420" cy="130" rx="60" ry="28" fill="none" stroke="#ffb36b" stroke-width="5" opacity="0.9"></ellipse><ellipse cx="420" cy="130" rx="70" ry="36" fill="none" stroke="#ffb36b" stroke-width="5" opacity="0.8"></ellipse><ellipse cx="420" cy="130" rx="80" ry="44" fill="none" stroke="#ffb36b" stroke-width="5" opacity="0.7"></ellipse><ellipse cx="420" cy="130" rx="90" ry="52" fill="none" stroke="#ffb36b" stroke-width="5" opacity="0.6"></ellipse><text x="420" y="136" font-size="12" fill="#7a3300" text-anchor="middle" font-weight="700">掺镱光纤（盘起来）</text><path d="M260,130 H300" stroke="#ffb36b" stroke-width="5"></path><path d="M540,130 H690" stroke="#ffb36b" stroke-width="5"></path><rect x="283" y="104" width="8" height="52" rx="2" fill="#7b8697"></rect><rect x="690" y="104" width="8" height="52" rx="2" fill="#7b8697" opacity=".55"></rect><text x="287" y="96" font-size="11" fill="#151a23" text-anchor="middle" font-weight="700">光栅</text><text x="694" y="96" font-size="11" fill="#151a23" text-anchor="middle" font-weight="700">光栅</text><text x="490" y="204" font-size="12" fill="#151a23" text-anchor="middle" font-weight="400">光纤里刻的“光栅”当镜子，不是真的镜子</text><rect x="698" y="127" width="102" height="6" fill="#e5383b" opacity=".7"></rect><rect x="40" y="226" width="760" height="100" rx="10" fill="#ffffff" stroke="#d8dee7"></rect><text x="60" y="252" font-size="15" fill="#151a23" text-anchor="start" font-weight="700">光纤激光器</text><text x="60" y="276" font-size="13" fill="#ff8a3d" text-anchor="start" font-weight="700">泵浦：半导体激光（泵浦源）</text><text x="60" y="298" font-size="13" fill="#151a23" text-anchor="start" font-weight="400">材料：一根掺了镱的光纤，盘起来　镜子：光纤里刻的两个光栅</text><text x="430" y="252" font-size="13" fill="#151a23" text-anchor="start" font-weight="700">波长：约 1.06 μm（1064 nm）</text><text x="430" y="276" font-size="13" fill="#151a23" text-anchor="start" font-weight="400">光束质量：光束很好，M² ≈ 1.1（单模）</text></svg>